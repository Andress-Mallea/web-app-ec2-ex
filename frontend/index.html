<!-- frontend/index.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Mirador · Recepción</title>
  <link rel="stylesheet" href="src/base/base.css">
  <link rel="stylesheet" href="src/blocks/header/header.css">
  <link rel="stylesheet" href="src/blocks/tabs/tabs.css">
  <link rel="stylesheet" href="src/blocks/page/page.css">
  <link rel="stylesheet" href="src/blocks/card/card.css">
  <link rel="stylesheet" href="src/blocks/form/form.css">
  <link rel="stylesheet" href="src/blocks/button/button.css">
  <link rel="stylesheet" href="src/blocks/table/table.css">
  <link rel="stylesheet" href="src/blocks/badge/badge.css">
  <link rel="stylesheet" href="src/blocks/alert/alert.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Hotel Mirador</h1>
    <p class="header__subtitle">Sistema de recepción</p>
    <nav class="tabs">
      <button type="button" class="tabs__item tabs__item--active" data-tab="reservations">Reservas</button>
      <button type="button" class="tabs__item" data-tab="rooms">Habitaciones</button>
      <button type="button" class="tabs__item" data-tab="guests">Huéspedes</button>
    </nav>
  </header>

  <main class="page">
    <div class="alert page__alert" data-js="message" hidden></div>

    <!-- RESERVAS -->
    <section data-panel="reservations">
      <div class="card page__item">
        <h2 class="card__title">Nueva reserva</h2>
        <form class="form" data-js="reservation-form">
          <label class="form__field">Habitación
            <select class="form__control" name="room_id" data-js="reservation-room" required></select>
          </label>
          <label class="form__field">Huésped
            <select class="form__control" name="guest_id" data-js="reservation-guest" required></select>
          </label>
          <label class="form__field">Ingreso
            <input class="form__control" type="date" name="check_in" required>
          </label>
          <label class="form__field">Salida
            <input class="form__control" type="date" name="check_out" required>
          </label>
          <label class="form__field">Personas
            <input class="form__control" type="number" name="guests_count" min="1" value="1" required>
          </label>
          <button type="submit" class="button">Reservar</button>
        </form>
      </div>

      <div class="card page__item">
        <div class="card__head">
          <h2 class="card__title">Reservas</h2>
          <select class="form__control" data-js="reservation-filter">
            <option value="">Todas</option>
            <option value="confirmed">Confirmadas</option>
            <option value="checked_in">Hospedados</option>
            <option value="checked_out">Finalizadas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th class="table__header-cell">#</th>
              <th class="table__header-cell">Hab.</th>
              <th class="table__header-cell">Huésped</th>
              <th class="table__header-cell">Ingreso</th>
              <th class="table__header-cell">Salida</th>
              <th class="table__header-cell">Noches</th>
              <th class="table__header-cell">Personas</th>
              <th class="table__header-cell">Total (Bs)</th>
              <th class="table__header-cell">Estado</th>
              <th class="table__header-cell"></th>
            </tr>
          </thead>
          <tbody data-js="reservations-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HABITACIONES -->
    <section data-panel="rooms" hidden>
      <div class="card page__item">
        <h2 class="card__title">Nueva habitación</h2>
        <form class="form" data-js="room-form">
          <label class="form__field">Número
            <input class="form__control" name="number" required>
          </label>
          <label class="form__field">Tipo
            <select class="form__control" name="type">
              <option value="single">Simple</option>
              <option value="double">Doble</option>
              <option value="family">Familiar</option>
              <option value="suite">Suite</option>
            </select>
          </label>
          <label class="form__field">Precio por noche (Bs)
            <input class="form__control" type="number" name="price_per_night" min="1" required>
          </label>
          <label class="form__field">Capacidad
            <input class="form__control" type="number" name="capacity" min="1" value="2" required>
          </label>
          <button type="submit" class="button">Guardar</button>
        </form>
      </div>

      <div class="card page__item">
        <h2 class="card__title">Habitaciones</h2>
        <table class="table">
          <thead>
            <tr>
              <th class="table__header-cell">Número</th>
              <th class="table__header-cell">Tipo</th>
              <th class="table__header-cell">Precio</th>
              <th class="table__header-cell">Capacidad</th>
              <th class="table__header-cell">Estado</th>
              <th class="table__header-cell"></th>
            </tr>
          </thead>
          <tbody data-js="rooms-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HUÉSPEDES -->
    <section data-panel="guests" hidden>
      <div class="card page__item">
        <h2 class="card__title">Nuevo huésped</h2>
        <form class="form" data-js="guest-form">
          <label class="form__field">Nombre completo
            <input class="form__control" name="full_name" required>
          </label>
          <label class="form__field">Email
            <input class="form__control" type="email" name="email" required>
          </label>
          <label class="form__field">Documento
            <input class="form__control" name="document" required>
          </label>
          <button type="submit" class="button">Guardar</button>
        </form>
      </div>

      <div class="card page__item">
        <h2 class="card__title">Huéspedes</h2>
        <table class="table">
          <thead>
            <tr>
              <th class="table__header-cell">Nombre</th>
              <th class="table__header-cell">Email</th>
              <th class="table__header-cell">Documento</th>
              <th class="table__header-cell"></th>
            </tr>
          </thead>
          <tbody data-js="guests-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
